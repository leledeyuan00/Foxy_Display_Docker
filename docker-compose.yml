# Development Dockerfile for ROS2 with Nvidia GPU support
# Maintainer: Dayuan
services:
  ros2_cuda:
    container_name: ros2_humble_cuda
    image: ros2_cuda_docker
    build: ./
    volumes:
      - ./packages:/root/ws/src/
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/:/dev/ # Little bit dangerous, but it works
    working_dir: /root/ws/src/
    environment:
      - DISPLAY=${DISPLAY}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu] # Required field to specify GPU access
              count: all # Request all available GPUs. Can also be an integer (e.g., 1) or a specific ID
    network_mode: "host"  # Must with this line to enable display
    ipc: host
    privileged: true
    stdin_open: true